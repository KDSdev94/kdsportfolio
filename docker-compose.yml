version: '3.8'

services:
  devporto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devporto-portfolio
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - devporto-network

  # Optional: Development mode dengan hot reload
  devporto-dev:
    image: node:24-alpine
    container_name: devporto-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - NODE_ENV=development
    networks:
      - devporto-network
    profiles:
      - dev

networks:
  devporto-network:
    driver: bridge
